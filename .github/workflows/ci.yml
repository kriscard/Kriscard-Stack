name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, node: 24, label: "24" }
          - { os: macos-latest, node: 26, label: "26" }
          - { os: ubuntu-latest, node: 24, label: linux-24 }
          - { os: ubuntu-latest, node: 26, label: linux-26 }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Inspect native storage prerequisites
        run: |
          node -e 'const fs = require("node:fs"); const os = require("node:os"); console.log(JSON.stringify({ node: process.version, platform: process.platform, checkoutType: fs.statfsSync(process.cwd()).type, temporaryType: fs.statfsSync(os.tmpdir()).type }));'
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            /bin/df -P -T apfs "${TMPDIR:-/tmp}"
          else
            stat -f -c '%T' "${TMPDIR:-/tmp}"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
